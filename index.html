<script>
  const birthMonth = 8; // Eylül = 8 (JavaScript ayları 0'dan başlar)
  const birthDay = 17;
  const birthYear = 2008;

  let episodes = JSON.parse(localStorage.getItem("mySeasonsEpisodes")) || [
    {
      title: "Mezuniyet",
      description: "Bir dönemin finali. Beklenenden biraz daha kaotik.",
      genre: "Dram",
      rating: 4.3,
      date: "2026-06-24"
    },
    {
      title: "Tercih Dönemi",
      description: "Üniversiteler, listeler ve gereğinden fazla düşünme.",
      genre: "Kaos",
      rating: 2.7,
      date: "2026-08-01"
    }
  ];

  let cast = JSON.parse(localStorage.getItem("mySeasonsCast")) || [];

  /* --------------------------------
     SEZON HESAPLAMA
  -------------------------------- */

  function getSeasonForDate(dateString) {
    const date = dateString
      ? new Date(dateString + "T12:00:00")
      : new Date();

    let season = date.getFullYear() - birthYear;

    const birthdayThatYear = new Date(
      date.getFullYear(),
      birthMonth,
      birthDay,
      0,
      0,
      0
    );

    if (date < birthdayThatYear) {
      season--;
    }

    return season;
  }

  function getCurrentSeason() {
    return getSeasonForDate();
  }

  function getEpisodesForSeason(season) {
    return episodes.filter(episode => {
      return getSeasonForDate(episode.date) === season;
    });
  }

  function getSeasonAverage(season) {
    const seasonEpisodes = getEpisodesForSeason(season);

    if (seasonEpisodes.length === 0) {
      return "—";
    }

    const total = seasonEpisodes.reduce((sum, episode) => {
      return sum + Number(episode.rating || 0);
    }, 0);

    return (total / seasonEpisodes.length).toFixed(1);
  }

  function getEpisodeNumber(episodeIndex) {
    const episode = episodes[episodeIndex];
    const season = getSeasonForDate(episode.date);

    let number = 0;

    for (let i = 0; i <= episodeIndex; i++) {
      if (getSeasonForDate(episodes[i].date) === season) {
        number++;
      }
    }

    return number;
  }

  /* --------------------------------
     KAYIT
  -------------------------------- */

  function saveData() {
    localStorage.setItem(
      "mySeasonsEpisodes",
      JSON.stringify(episodes)
    );

    localStorage.setItem(
      "mySeasonsCast",
      JSON.stringify(cast)
    );
  }

  /* --------------------------------
     ALT MENÜ
  -------------------------------- */

  function showPage(pageId, button) {
    document.querySelectorAll(".page").forEach(page => {
      page.classList.add("hidden");
    });

    document.getElementById(pageId).classList.remove("hidden");

    document.querySelectorAll(".nav-button").forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  /* --------------------------------
     BÖLÜMLERİ GÖSTER
  -------------------------------- */

  function renderEpisodes() {
    const currentSeason = getCurrentSeason();
    const currentEpisodes = getEpisodesForSeason(currentSeason);
    const average = getSeasonAverage(currentSeason);

    document.getElementById("homeSeasonTitle").textContent =
      `SEZON ${currentSeason}`;

    document.getElementById("profileSeason").textContent =
      currentSeason;

    document.getElementById("seasonAverage").textContent =
      average;

    document.getElementById("profileAverage").textContent =
      average;

    document.getElementById("profileEpisodeCount").textContent =
      episodes.length;

    document.getElementById("episodeCountNote").textContent =
      `${currentEpisodes.length} bölüm`;

    const homeList =
      document.getElementById("homeEpisodeList");

    const allList =
      document.getElementById("allEpisodeList");

    homeList.innerHTML = "";
    allList.innerHTML = "";

    /* ANA SAYFA:
       SADECE AKTİF SEZON
    */

    if (currentEpisodes.length === 0) {
      homeList.innerHTML = `
        <div class="empty">
          Sezon ${currentSeason} henüz başlamış gibi görünüyor.
          İlk bölümünü ekleyebilirsin. 🎬
        </div>
      `;
    } else {
      const currentSeasonIndexes = [];

      episodes.forEach((episode, index) => {
        if (
          getSeasonForDate(episode.date) === currentSeason
        ) {
          currentSeasonIndexes.push(index);
        }
      });

      currentSeasonIndexes
        .slice(-3)
        .reverse()
        .forEach(index => {
          homeList.innerHTML +=
            createEpisodeCard(index);
        });
    }

    /* BÖLÜMLER SAYFASI:
       TÜM SEZONLAR
    */

    if (episodes.length === 0) {
      allList.innerHTML = `
        <div class="empty">
          Henüz hiçbir bölüm yok.
        </div>
      `;
    } else {
      episodes
        .map((episode, index) => ({
          episode,
          index
        }))
        .reverse()
        .forEach(item => {
          allList.innerHTML +=
            createEpisodeCard(item.index);
        });
    }
  }

  function createEpisodeCard(index) {
    const episode = episodes[index];

    const season =
      getSeasonForDate(episode.date);

    const episodeNumber =
      String(getEpisodeNumber(index)).padStart(2, "0");

    const rating =
      Number(episode.rating).toFixed(1);

    return `
      <div class="episode-card">

        <div class="episode-top">

          <div class="episode-code">
            S${season} • E${episodeNumber}
          </div>

          <div class="episode-rating">
            ⭐ ${rating}
          </div>

        </div>

        <div class="episode-title">
          ${escapeHtml(episode.title)}
        </div>

        <div class="episode-desc">
          ${
            escapeHtml(
              episode.description ||
              "Bu bölüm için henüz açıklama yok."
            )
          }
        </div>

        <div class="tag-row">

          <span class="tag">
            ${escapeHtml(episode.genre)}
          </span>

          ${
            episode.date
              ? `
                <span class="tag">
                  ${formatDate(episode.date)}
                </span>
              `
              : ""
          }

          <span class="tag">
            Sezon ${season}
          </span>

        </div>

      </div>
    `;
  }

  /* --------------------------------
     YENİ BÖLÜM
  -------------------------------- */

  function openEpisodeModal() {
    document
      .getElementById("episodeModal")
      .classList.remove("hidden");

    const today = new Date();

    const year =
      today.getFullYear();

    const month =
      String(today.getMonth() + 1).padStart(2, "0");

    const day =
      String(today.getDate()).padStart(2, "0");

    document.getElementById(
      "episodeDateInput"
    ).value = `${year}-${month}-${day}`;
  }

  function closeEpisodeModal() {
    document
      .getElementById("episodeModal")
      .classList.add("hidden");
  }

  function updateRatingPreview() {
    const value =
      document.getElementById(
        "episodeRatingInput"
      ).value;

    document.getElementById(
      "ratingPreview"
    ).textContent = value;
  }

  function saveEpisode() {
    const title =
      document.getElementById(
        "episodeTitleInput"
      ).value.trim();

    const description =
      document.getElementById(
        "episodeDescriptionInput"
      ).value.trim();

    const genre =
      document.getElementById(
        "episodeGenreInput"
      ).value;

    const rating =
      Number(
        document.getElementById(
          "episodeRatingInput"
        ).value
      );

    const date =
      document.getElementById(
        "episodeDateInput"
      ).value;

    if (!title) {
      alert("Bölüm adı yazmalısın.");
      return;
    }

    if (!date) {
      alert("Bölümün tarihini seçmelisin.");
      return;
    }

    episodes.push({
      title,
      description,
      genre,
      rating,
      date
    });

    saveData();
    renderEpisodes();

    document.getElementById(
      "episodeTitleInput"
    ).value = "";

    document.getElementById(
      "episodeDescriptionInput"
    ).value = "";

    document.getElementById(
      "episodeRatingInput"
    ).value = "7.5";

    document.getElementById(
      "ratingPreview"
    ).textContent = "7.5";

    closeEpisodeModal();
  }

  /* --------------------------------
     OYUNCULAR
  -------------------------------- */

  function renderCast() {
    const castList =
      document.getElementById("castList");

    document.getElementById(
      "profileCastCount"
    ).textContent = cast.length;

    castList.innerHTML = "";

    if (cast.length === 0) {
      castList.innerHTML = `
        <div class="empty">
          Henüz oyuncu eklenmedi.
        </div>
      `;

      return;
    }

    cast.forEach(person => {
      castList.innerHTML += `
        <div class="person-card">

          <div class="person-name">
            ${escapeHtml(person.name)}
          </div>

          <div class="person-role">
            ${escapeHtml(person.role)}
          </div>

          ${
            person.note
              ? `
                <div
                  class="episode-desc"
                  style="margin-top:10px;"
                >
                  ${escapeHtml(person.note)}
                </div>
              `
              : ""
          }

        </div>
      `;
    });
  }

  function openCastModal() {
    document
      .getElementById("castModal")
      .classList.remove("hidden");
  }

  function closeCastModal() {
    document
      .getElementById("castModal")
      .classList.add("hidden");
  }

  function saveCast() {
    const name =
      document.getElementById(
        "castNameInput"
      ).value.trim();

    const role =
      document.getElementById(
        "castRoleInput"
      ).value;

    const note =
      document.getElementById(
        "castNoteInput"
      ).value.trim();

    if (!name) {
      alert("Oyuncunun ismini yazmalısın.");
      return;
    }

    cast.push({
      name,
      role,
      note
    });

    saveData();
    renderCast();

    document.getElementById(
      "castNameInput"
    ).value = "";

    document.getElementById(
      "castNoteInput"
    ).value = "";

    closeCastModal();
  }

  /* --------------------------------
     TARİH
  -------------------------------- */

  function formatDate(dateString) {
    const date =
      new Date(dateString + "T12:00:00");

    return date.toLocaleDateString(
      "tr-TR",
      {
        day: "numeric",
        month: "short",
        year: "numeric"
      }
    );
  }

  function escapeHtml(text) {
    const div =
      document.createElement("div");

    div.textContent =
      String(text ?? "");

    return div.innerHTML;
  }

  /* --------------------------------
     UYGULAMAYI BAŞLAT
  -------------------------------- */

  renderEpisodes();
  renderCast();
    </script>
